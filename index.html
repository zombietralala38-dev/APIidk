<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAN SYSTEM | Armor Protection</title>
    <style>
        :root {
            --bg: #030406;
            --panel: #0a0c12;
            --sean-blue: #00d2ff; /* Azul SEAN */
            --sean-glow: rgba(0, 210, 255, 0.4);
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border: #1e293b;
            --danger: #ff4757;
        }

        body {
            background-color: var(--bg);
            color: var(--text-white);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Fondo de cuadricula tecnológica */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.15;
        }

        header {
            background: rgba(10, 12, 18, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            border-bottom: 1px solid var(--sean-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--sean-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--sean-blue);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--sean-blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            padding: 30px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--sean-blue), transparent);
        }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--sean-blue);
            margin-top: 0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Botón Estilo SEAN */
        .btn-sean {
            width: 100%;
            background: var(--sean-blue);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .btn-sean:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px var(--sean-glow);
        }

        /* Listas */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .item-box:hover {
            border-color: var(--sean-blue);
            background: rgba(0, 210, 255, 0.05);
        }

        .item-box strong {
            display: block;
            font-family: 'Consolas', monospace;
            color: var(--sean-blue);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .item-box span {
            font-size: 0.75rem;
            color: var(--text-gray);
        }

        /* Bloque de Código */
        .code-block {
            background: #000;
            padding: 12px;
            border-radius: 5px;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            color: #7efaff;
            border: 1px solid #1e293b;
            margin-top: 10px;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--sean-blue); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="status-dot"></span>
            SEAN SYSTEM ARMOR v1.0
        </div>
        <div id="connection-status" style="font-size: 0.7rem; letter-spacing: 1px;">
            CORE STATUS: <span style="color: var(--sean-blue)">ENCRYPTED</span>
        </div>
    </header>

    <div class="main-grid">
        <div class="card">
            <h2>🛡️ CONTROL DE LICENCIAS</h2>
            <button class="btn-sean" onclick="generateKey()">+ GENERAR NUEVA KEY</button>
            <div class="list-container" id="keyList">
                </div>
        </div>

        <div class="card">
            <h2>📂 BÓVEDA DE SCRIPTS PROTEGIDOS</h2>
            <div class="list-container" id="scriptList">
                </div>
        </div>
    </div>

    <script>
        // Detecta automáticamente si es Local o Railway
        const API_URL = window.location.origin + '/api';

        async function generateKey() {
            try {
                const res = await fetch(`${API_URL}/keys`, { method: 'POST' });
                if (res.ok) fetchAll();
            } catch (err) { console.error("Error API"); }
        }

        async function fetchAll() {
            try {
                // Obtener Keys
                const rKeys = await fetch(`${API_URL}/keys`);
                const keys = await rKeys.json();
                document.getElementById('keyList').innerHTML = keys.map(k => `
                    <div class="item-box">
                        <strong>${k.key}</strong>
                        <span>FECHA: ${new Date(k.created_at).toLocaleString()}</span>
                    </div>
                `).join('');

                // Obtener Scripts
                const rScripts = await fetch(`${API_URL}/scripts`);
                const scripts = await rScripts.json();
                document.getElementById('scriptList').innerHTML = scripts.map(s => `
                    <div class="item-box">
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <b style="color:#fff">${s.name}</b>
                            <span style="color:var(--sean-blue)">BY: ${s.key_used}</span>
                        </div>
                        <div class="code-block">${s.code}</div>
                        <span style="margin-top:8px; display:block">PROTEGIDO EL: ${new Date(s.created_at).toLocaleString()}</span>
                    </div>
                `).join('');

            } catch (err) {
                console.log("Reconectando con SEAN CORE...");
            }
        }

        // Refresco automático cada 5 segundos
        setInterval(fetchAll, 5000);
        fetchAll();
    </script>
</body>
</html>
